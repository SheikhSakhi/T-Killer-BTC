name: daily-forecast

on:
  schedule:
    - cron: "7 0 * * *"   # 00:07 UTC, right after the daily candle closes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KRONOS_COMMIT: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Fetch Kronos (pinned)
        run: |
          git clone https://github.com/shiyu-coder/Kronos vendor/Kronos
          git -C vendor/Kronos checkout "$KRONOS_COMMIT"

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-small-v1

      - name: Forecast and score
        run: python forecast/daily.py

      - name: Commit
        run: |
          git config user.name "t-killer-bot"
          git config user.email "t-killer-bot@users.noreply.github.com"
          git add LATEST.md data/
          git diff --cached --quiet || git commit -m "forecast $(date -u +%F)"
          git push
