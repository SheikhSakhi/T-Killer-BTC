name: backtest

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Number of non-overlapping 24h windows"
        default: "180"
      samples:
        description: "Sampled paths per window"
        default: "30"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KRONOS_COMMIT: 67b630e67f6a18c9e9be918d9b4337c960db1e9a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Fetch Kronos (pinned)
        run: |
          git clone https://github.com/shiyu-coder/Kronos vendor/Kronos
          git -C vendor/Kronos checkout "$KRONOS_COMMIT"

      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kronos-small-v1

      - name: Backtest
        # Stop before the job limit so partial results still get committed; rerun to resume.
        timeout-minutes: 320
        run: |
          python forecast/backtest.py --days $(( ${{ inputs.windows }} + 25 )) \
            --windows ${{ inputs.windows }} --samples ${{ inputs.samples }} \
            --out "results/backtest-${{ inputs.windows }}w-${{ inputs.samples }}s"

      - name: Commit
        if: always()
        run: |
          git config user.name "t-killer-bot"
          git config user.email "t-killer-bot@users.noreply.github.com"
          git add results/
          git commit -m "backtest ${{ inputs.windows }} windows" || exit 0
          git pull --rebase origin main
          git push
